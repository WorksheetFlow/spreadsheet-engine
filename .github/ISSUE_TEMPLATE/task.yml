name: Development Task
description: Track an actionable implementation task
title: "[Task] "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: parent
    attributes:
      label: Related Feature / Issue
      description: Link the parent feature or management issue.
  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: "- [ ] ..."
      validations:
        required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests, build, manual verification, or evidence.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence Links
