name: Research
description: Track research or validation work
title: "[Research] "
labels: ["type:research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Research Question
      validations:
        required: true
  - type: textarea
    id: context
    attributes:
      label: Context / Why
  - type: textarea
    id: method
    attributes:
      label: Research Method
      description: Sources, interviews, prototypes, data, or experiments.
  - type: textarea
    id: findings
    attributes:
      label: Findings
  - type: textarea
    id: conclusion
    attributes:
      label: Conclusion / Recommendation
  - type: textarea
    id: followup
    attributes:
      label: Follow-up Issues
