name: Feature
description: Define a product feature with scope and acceptance criteria
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should this feature achieve?
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: User Scenario
      description: Who uses it, and in what context?
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In-scope behavior and boundaries.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List verifiable criteria.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
  - type: dropdown
    id: target-repo
    attributes:
      label: Target Repository
      options:
        - worksheet-flow-product
        - worksheet-flow
        - spreadsheet-engine
        - worksheet-flow-docs
