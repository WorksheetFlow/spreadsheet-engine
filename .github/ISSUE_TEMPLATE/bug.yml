name: Bug Report
description: Report a reproducible bug
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS / version / build
  - type: textarea
    id: description
    attributes:
      label: Description
      validations:
        required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach screenshots, logs, or sample files where appropriate.
